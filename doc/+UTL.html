<!doctype html>
<html>
<head>
    <title>Ultraviolet Build Tool</title>
    <meta charset="utf-8">
    <meta name="author" content="">
    <link rel="stylesheet" type="text/css" href="style.css" media="screen,print">
    <style>
        body.inside-iframe :is(header, footer) {
            display: none;
            }
    </style>
</head>

<body class="doc">
    <script>
        let body    = document.querySelector("body");
        if(window.parent !== window) {
            body.classList.add('inside-iframe');
            }
    </script>

    <header>
        <div class="title"><a href="index.html">Ultraviolet Build Tool</a></div>
        <div class="subtitle">Developer Documentation</div>
        <div class="subtext">Version 1.06, Produced 2026-08-07</div>
        <div class="page-links"><span title="Previous Page (Arrow Left)"><a class='prev' href='Litmus.html'>prev</a></span> <span title="Next Page (Arrow Right)"><a class='next' href='RewriteJavaDoc.html'>next</a></span></div>
    </header>

    <main id="dgc">
        <article class="doc">
<h1 id="javascript-utility">JavaScript Utility</h1><p>These JavaScript utillity modules provide specialized, once-off functionality.</p></article>

    </main>

    <footer>
        <div class="subtext">Copyright , All Rights Reserved</div>
        <div class="page-links"><span title="Previous Page (Arrow Left)"><a class='prev' href='Litmus.html'>prev</a></span> | <a href="">top</a> | <a href="index.html">index</a> | <span title="Next Page (Arrow Right)"><a class='next' href='RewriteJavaDoc.html'>next</a></span></div>
    </footer>

    <script>
        setTimeout(() => {
            document.querySelector("#dgc")?.focus();
            },100);
        document.onkeydown = (evt) => {
            if(!evt.altKey && !evt.ctrlKey && !evt.metaKey && !evt.shiftKey) {
                switch(evt.key) {
                    case "ArrowLeft" : {
                        let elm = document.querySelector("header .page-links .prev");
                        if(elm) { location.href = elm.href; }
                        evt.preventDefault();
                        } break;
                    case "ArrowRight" : {
                        let elm = document.querySelector("header .page-links .next");
                        if(elm) { location.href = elm.href; }
                        evt.preventDefault();
                        } break;
                    }
                }
            };
    </script>
</body>
</html>
